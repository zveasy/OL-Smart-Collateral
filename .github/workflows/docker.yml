name: Docker Image

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ol-smart-collateral-api:ci .

      - name: Test
        run: docker run --rm ol-smart-collateral-api:ci pytest -q

