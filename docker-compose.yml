version: "3.9"
services:
  api:
    build: .
    image: ol-smart-collateral-api:dev
    ports:
      - "8000:8000"
    env_file:
      - .env                    # << keep your Kaleido secrets here
    environment:
      LOG_LEVEL: info
      # PYTHONPATH is already set in Dockerfile; keep if you want to override
      # PYTHONPATH: /app
    restart: unless-stopped

